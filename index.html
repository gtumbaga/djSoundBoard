<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="format-detection" content="telephone=no">
    <title>CF Pads</title>
    <link rel="stylesheet" href="styles.css?v=1.0.15">
</head>
<body>
    <div class="sound-board-container">
        <div class="sound-board-header">
            <h1>CF Pads</h1>
        </div>
        <div class="sound-board">
            <button id="btn-01" class="sound-button button" data-sound="./sounds/djgtraxx.mp3">djgtraxx <span class="key">Z</span></button>
            <button id="btn-02" class="sound-button button" data-sound="./sounds/djsoloquest.wav">djsoloquest <span class="key">X</span></button>
            <button id="btn-03" class="sound-button button" data-sound="./sounds/cfdj.wav">cf <span class="key">C</span></button>
            <button id="btn-04" class="sound-button button" data-sound="./sounds/airhorn.wav">Horn <span class="key">V</span></button>
        </div>
        <div class="sound-board bottom">
            <button id="btn-bpm" class="button">BPM<span class="key">B</span></button>
            <div id="bpm-display" class="bpm-display">0</div>
        </div>
    </div>

    <!-- Add preloaded audio elements -->
    <audio id="djgtraxx-audio" src="./sounds/djgtraxx.mp3" preload="auto" data-volume=".7" data-duration="3500"></audio>
    <audio id="djsoloquest-audio" src="./sounds/djsoloquest.wav" preload="auto" data-volume=".8"></audio>
    <audio id="cfdj-audio" src="./sounds/cfdj.wav" preload="auto" data-volume=".8"></audio>
    <audio id="airhorn-audio" src="./sounds/airhorn.wav" preload="auto" data-volume="1" data-duration="2000"></audio>

    <script>
    document.addEventListener('keydown', function(event) {
        if (event.key === 'z' || event.key === 'Z') {
            document.getElementById('btn-01').dispatchEvent(new Event('mousedown'));
        } else if (event.key === 'x' || event.key === 'X') {
            document.getElementById('btn-02').dispatchEvent(new Event('mousedown'));
        } else if (event.key === 'c' || event.key === 'C') {
            document.getElementById('btn-03').dispatchEvent(new Event('mousedown'));
        } else if (event.key === 'v' || event.key === 'V') {
            document.getElementById('btn-04').dispatchEvent(new Event('mousedown'));
        } else if (event.key === 'b' || event.key === 'B') {
            document.getElementById('btn-bpm').dispatchEvent(new Event('mousedown'));
        }
    });
    </script>
    <script src="script.js?v=1.0.15"></script>
    <div class="footer">
        <small>v1.0.15</small>
    </div>
</body>
</html>
